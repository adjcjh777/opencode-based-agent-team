name: Bug Report
description: Report a reproducible bug in CodexAgentTeams.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe what is broken.
      placeholder: Short bug summary
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant output from `doctor`, tests, or stack traces.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS + Node.js version + package version
      placeholder: Windows 11, Node 22.17.1, codexagentteams 0.1.0
    validations:
      required: true

